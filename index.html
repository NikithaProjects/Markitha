<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Reader with Highlights & Notes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0ec; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    #toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: #fff;
      border-bottom: 1px solid #ddd; flex-shrink: 0; flex-wrap: wrap;
    }
    #toolbar h1 { font-size: 15px; font-weight: 600; color: #1a1a1a; flex: 1; }
    .tool-btn {
      padding: 5px 12px; font-size: 13px; border-radius: 8px;
      border: 1px solid #ccc; background: #f4f4f0; color: #1a1a1a;
      cursor: pointer; transition: background 0.15s;
    }
    .tool-btn:hover { background: #e4e4e0; }
    #highlight-color-picker { display: none; align-items: center; gap: 6px; }
    .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.selected { border-color: #333; }
    #page-nav { display: none; align-items: center; gap: 8px; font-size: 13px; color: #555; }
    .tip { font-size: 12px; color: #888; padding: 4px 10px; background: #f4f4f0; border-radius: 20px; }

    #main { display: flex; flex: 1; overflow: hidden; }

    /* PDF panel */
    #pdf-panel { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #drop-zone {
      width: 100%; max-width: 720px; border: 2px dashed #bbb;
      border-radius: 12px; padding: 60px 20px; text-align: center;
      cursor: pointer; background: #fff;
    }
    #drop-zone:hover { border-color: #7F77DD; }
    #drop-zone .icon { font-size: 40px; margin-bottom: 12px; }
    #drop-zone p { color: #888; font-size: 14px; margin-top: 8px; }
    #pdf-container { width: 100%; max-width: 720px; display: none; flex-direction: column; gap: 14px; }

    /* Page wrapper — critical for text layer alignment */
    .page-wrap {
      position: relative; background: white;
      border-radius: 6px; border: 1px solid #ddd; overflow: hidden;
      /* width/height set dynamically */
    }
    .page-wrap canvas { display: block; position: absolute; top: 0; left: 0; }
    .page-wrap .textLayer {
      position: absolute; top: 0; left: 0;
      overflow: hidden; opacity: 1;
      line-height: 1;
    }
    /* pdf.js text layer styles */
    .textLayer span,
    .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer .highlight { margin: -1px; padding: 1px; background-color: rgba(180,0,170,0.25); border-radius: 4px; }
    .textLayer .highlight.appended { position: initial; }
    .textLayer .highlight.begin { border-radius: 4px 0px 0px 4px; }
    .textLayer .highlight.end { border-radius: 0px 4px 4px 0px; }
    .textLayer .highlight.middle { border-radius: 0px; }
    .textLayer .highlight.selected { background-color: rgba(0,100,0,0.25); }
    ::selection { background: rgba(100,100,255,0.3); }
    .textLayer ::-moz-selection { background: rgba(100,100,255,0.3); }

    /* highlight overlay canvas */
    .highlight-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .page-label { position: absolute; bottom: 8px; right: 10px; font-size: 11px; color: #999; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 4px; }

    /* Notes panel */
    #notes-panel { width: 290px; flex-shrink: 0; border-left: 1px solid #ddd; background: #fff; display: flex; flex-direction: column; }
    #notes-header { padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; }
    #notes-header h2 { font-size: 14px; font-weight: 600; }
    #notes-count { font-size: 12px; color: #666; background: #f0f0ec; padding: 2px 8px; border-radius: 20px; }
    #notes-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .note-item { background: #f9f9f7; border-radius: 8px; padding: 10px 12px; position: relative; border-left: 3px solid #ccc; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .note-text { font-size: 13px; color: #1a1a1a; line-height: 1.5; }
    .note-meta { font-size: 11px; color: #888; margin-top: 4px; }
    .note-del { position: absolute; top: 8px; right: 8px; font-size: 13px; cursor: pointer; color: #bbb; opacity: 0; background: none; border: none; }
    .note-item:hover .note-del { opacity: 1; }
    #notes-empty { text-align: center; padding: 40px 16px; color: #aaa; font-size: 13px; line-height: 1.6; }
    #export-btn { margin: 12px; display: none; }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>📄 PDF Reader</h1>
    <span class="tip" id="tip">Upload a PDF to begin</span>
    <div id="highlight-color-picker">
      <span style="font-size:12px;color:#666">Highlight:</span>
      <div class="color-dot selected" style="background:#FFE033" data-color="#FFE033" title="Yellow"></div>
      <div class="color-dot" style="background:#6EE7B7" data-color="#6EE7B7" title="Green"></div>
      <div class="color-dot" style="background:#FCA5A5" data-color="#FCA5A5" title="Pink"></div>
      <div class="color-dot" style="background:#93C5FD" data-color="#93C5FD" title="Blue"></div>
    </div>
    <div id="page-nav">
      <button class="tool-btn" id="prev-page">‹ Prev</button>
      <span id="page-info">1 / 1</span>
      <button class="tool-btn" id="next-page">Next ›</button>
    </div>
    <label class="tool-btn" style="cursor:pointer">
      Open PDF <input type="file" accept=".pdf" id="file-input" style="display:none">
    </label>
  </div>

  <div id="main">
    <div id="pdf-panel">
      <div id="drop-zone">
        <div class="icon">📄</div>
        <strong style="font-size:16px;color:#333">Drop a PDF here</strong>
        <p>or click <strong>Open PDF</strong> above<br>Select any text to highlight → auto-saves to Notes</p>
      </div>
      <div id="pdf-container"></div>
    </div>

    <div id="notes-panel">
      <div id="notes-header">
        <h2>📝 Notes</h2>
        <span id="notes-count">0</span>
      </div>
      <div id="notes-list">
        <div id="notes-empty">Highlight text in the PDF<br>to add bullet-point notes here.</div>
      </div>
      <button class="tool-btn" id="export-btn">⬇ Export notes as .txt</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null, notes = [], activeColor = '#FFE033';

const fileInput    = document.getElementById('file-input');
const dropZone     = document.getElementById('drop-zone');
const pdfContainer = document.getElementById('pdf-container');
const notesList    = document.getElementById('notes-list');
const notesEmpty   = document.getElementById('notes-empty');
const notesCount   = document.getElementById('notes-count');
const exportBtn    = document.getElementById('export-btn');
const tip          = document.getElementById('tip');
const pageNav      = document.getElementById('page-nav');
const colorPicker  = document.getElementById('highlight-color-picker');

// ── file / drop ──────────────────────────────────────────────────
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadPDF(e.target.files[0]); });
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='#7F77DD'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor=''; });
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.style.borderColor='';
  if (e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
});

// ── color picker ─────────────────────────────────────────────────
document.querySelectorAll('.color-dot').forEach(d => {
  d.addEventListener('click', () => {
    document.querySelectorAll('.color-dot').forEach(x => x.classList.remove('selected'));
    d.classList.add('selected');
    activeColor = d.dataset.color;
  });
});

// ── load PDF ─────────────────────────────────────────────────────
async function loadPDF(file) {
  const buf = await file.arrayBuffer();
  pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
  const total = pdfDoc.numPages;

  dropZone.style.display = 'none';
  pdfContainer.style.display = 'flex';
  pdfContainer.innerHTML = '';
  pageNav.style.display = 'flex';
  colorPicker.style.display = 'flex';
  tip.textContent = 'Select text → highlights + adds to Notes';
  document.getElementById('page-info').textContent = `1 / ${total}`;

  for (let i = 1; i <= total; i++) await renderPage(i, total);

  document.getElementById('prev-page').onclick = () =>
    scrollToPage(Math.max(1, visiblePage() - 1));
  document.getElementById('next-page').onclick = () =>
    scrollToPage(Math.min(total, visiblePage() + 1));
}

// ── render one page ───────────────────────────────────────────────
async function renderPage(pageNum, total) {
  const page     = await pdfDoc.getPage(pageNum);
  const DPR      = window.devicePixelRatio || 1;
  const BASE_W   = pdfContainer.clientWidth || 680;
  const viewport = page.getViewport({ scale: 1 });
  const scale    = BASE_W / viewport.width;
  const vp       = page.getViewport({ scale });

  // wrapper — explicit pixel size so text layer aligns perfectly
  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';
  wrap.dataset.page = pageNum;
  wrap.style.width  = vp.width  + 'px';
  wrap.style.height = vp.height + 'px';

  // main render canvas (HiDPI)
  const canvas  = document.createElement('canvas');
  canvas.width  = Math.round(vp.width  * DPR);
  canvas.height = Math.round(vp.height * DPR);
  canvas.style.width  = vp.width  + 'px';
  canvas.style.height = vp.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;

  // highlight canvas (same CSS size, 1:1 pixels — easier maths)
  const hlCanvas  = document.createElement('canvas');
  hlCanvas.className = 'highlight-canvas';
  hlCanvas.width  = vp.width;
  hlCanvas.height = vp.height;
  hlCanvas.style.width  = vp.width  + 'px';
  hlCanvas.style.height = vp.height + 'px';

  // text layer div — must match viewport exactly
  const textDiv = document.createElement('div');
  textDiv.className = 'textLayer';
  textDiv.style.width  = vp.width  + 'px';
  textDiv.style.height = vp.height + 'px';

  const textContent = await page.getTextContent();
  // pdf.js 3.x API
  const renderTask = pdfjsLib.renderTextLayer({
    textContentSource: textContent,
    container: textDiv,
    viewport: vp,
    textDivs: [],
  });
  await renderTask.promise;

  const label = document.createElement('div');
  label.className = 'page-label';
  label.textContent = `Page ${pageNum} / ${total}`;

  wrap.appendChild(canvas);
  wrap.appendChild(hlCanvas);
  wrap.appendChild(textDiv);
  wrap.appendChild(label);
  pdfContainer.appendChild(wrap);

  // ── selection → highlight ───────────────────────────────────────
  wrap.addEventListener('mouseup', () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    const text = sel.toString().trim();
    if (text.length < 2) return;

    paintHighlight(sel, wrap, hlCanvas);
    addNote(text, pageNum, activeColor);
    sel.removeAllRanges();
  });
}

// ── paint highlight rectangles onto the hl canvas ─────────────────
function paintHighlight(sel, wrap, hlCanvas) {
  if (!sel.rangeCount) return;
  const range  = sel.getRangeAt(0);
  const rects  = range.getClientRects();
  const wRect  = wrap.getBoundingClientRect();
  const ctx    = hlCanvas.getContext('2d');

  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle   = activeColor;
  for (const r of rects) {
    if (r.width < 1 || r.height < 1) continue;
    ctx.fillRect(
      r.left - wRect.left,
      r.top  - wRect.top,
      r.width,
      r.height
    );
  }
  ctx.restore();
}

// ── notes ─────────────────────────────────────────────────────────
function addNote(text, pageNum, color) {
  notes.push({ id: Date.now(), text, pageNum, color });
  renderNotes();
}

function renderNotes() {
  notesCount.textContent = notes.length;
  if (!notes.length) {
    notesList.innerHTML = '';
    notesList.appendChild(notesEmpty);
    notesEmpty.style.display = 'block';
    exportBtn.style.display  = 'none';
    return;
  }
  notesEmpty.style.display = 'none';
  exportBtn.style.display  = 'block';
  notesList.innerHTML = '';
  notes.forEach(n => {
    const div = document.createElement('div');
    div.className = 'note-item';
    div.style.borderLeftColor = n.color;
    div.innerHTML = `
      <div class="note-text">• ${esc(n.text)}</div>
      <div class="note-meta">Page ${n.pageNum}</div>
      <button class="note-del" title="Remove">✕</button>`;
    div.querySelector('.note-del').addEventListener('click', () => {
      notes = notes.filter(x => x.id !== n.id);
      renderNotes();
    });
    notesList.appendChild(div);
  });
}

exportBtn.addEventListener('click', () => {
  const body = notes.map((n, i) => `${i+1}. ${n.text}  [Page ${n.pageNum}]`).join('\n');
  const blob = new Blob([`PDF Highlights & Notes\n${'─'.repeat(40)}\n\n${body}`], { type: 'text/plain' });
  Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'pdf-notes.txt' }).click();
});

// ── helpers ───────────────────────────────────────────────────────
function visiblePage() {
  let best = 1;
  pdfContainer.querySelectorAll('.page-wrap').forEach((p, i) => {
    if (p.getBoundingClientRect().top < window.innerHeight * 0.6) best = i + 1;
  });
  return best;
}
function scrollToPage(n) {
  const p = pdfContainer.querySelectorAll('.page-wrap')[n - 1];
  if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
